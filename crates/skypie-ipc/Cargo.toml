[package]
name = "skypie-ipc"
version.workspace = true
edition.workspace = true
description = "Local request/response contract between the Sky Pie app and skypie-mcp"

[dependencies]
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt"] }

[features]
# Compiles `Request::E2eEval` / `Reply::E2eResult` into a RELEASE build too.
# A dev build (any `cargo build` with no `--release`) already has them via
# `debug_assertions` — this feature exists only so `skypie-app`'s own
# same-named feature can carry the gate through to this crate for a release
# build that wants the hook (see app/Cargo.toml).
e2e-hooks = []
